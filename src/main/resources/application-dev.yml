server:
  port: 8080

spring:
  redis:
    host: dearlavion-redis
    port: 6379
    timeout: 5000ms

  cloud:
    gateway:
      httpclient:
        websocket:
          max-frame-payload-length: 65536

      routes:
        - id: media-service
          uri: "http://dearlavion-spring-media-service:${MEDIA_PORT}"
          predicates:
            - Path=/api/media/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # ======================
        # Booking Engine
        # ======================
        - id: booking-engine
          uri: "http://dearlavion-booking-engine:${BOOKING_PORT}"
          predicates:
            - Path=/api/booking/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # ======================
        # Auth Service
        # ======================
        - id: auth-service
          uri: "http://dearlavion-authentication-service:${AUTH_PORT}"
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolverBean}"
                redis-rate-limiter:
                  replenishRate: 1
                  burstCapacity: 2

        # ======================
        # Core Service
        # ======================
        - id: core-service
          uri: "http://dearlavion-core-service:${CORE_PORT}"
          predicates:
            - Path=/api/core/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolverBean}"
                redis-rate-limiter:
                  replenishRate: 1
                  burstCapacity: 2

        # ======================
        # Notification Service (WebSocket)
        # ======================
        - id: notification-service
          uri: "http://dearlavion-spring-notification-service:${NOTIFICATION_PORT}"
          predicates:
            - Path=/api/notification/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # ======================
        # Store Engine v2 (Travel Besty)
        # ======================
        - id: store-engine-v2
          uri: "http://dearlavion-spring-store-engine-v2:${STORE_ENGINE_V2_PORT}"
          predicates:
            - Path=/api/store-engine-v2/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # ======================
        # Payment Service v2 (Travel Besty)
        # ======================
        - id: payment-service-v2
          uri: "http://dearlavion-spring-payment-service-v2:${PAYMENT_SERVICE_V2_PORT}"
          predicates:
            - Path=/api/payment-service-v2/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # ======================
        # Master Data Service (Travel Besty reference data)
        # ======================
        - id: master-data
          uri: "http://dearlavion-spring-master-data-service:${MASTER_DATA_PORT}"
          predicates:
            - Path=/api/master-data/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # ======================
        # Authentication Service v3 (multi-tenant, Travel Besty)
        # ======================
        - id: auth-v3
          uri: "http://dearlavion-spring-authentication-service-v3:${AUTH_V3_PORT}"
          predicates:
            - Path=/api/auth-v3/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolverBean}"
                redis-rate-limiter:
                  replenishRate: 1
                  burstCapacity: 2

        # ======================
        # Kafka UI (AKHQ)
        # ======================
        - id: akhq
          uri: "http://dearlavion-akhq:${AKHQ_PORT}"
          predicates:
            - Path=/api/kafka/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Forwarded-Prefix, /api/kafka
logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG